title: Arrangement

# Fields shown in the page creation dialog
create:
  fields: 
    - eventimid
    - theasoftid

sections:
  eventpages:
    type: pages
    label: Termine
    # text: "{{ page.date.toDate('dd.MM.yyyy h:mm') }}"

  fields:
    type: fields
    fields:
      eventimid:
        label: Eventim ID
        type: tags
        # max: 2
        help: "Das sind die IDs der Events "
        options:
          type: api
          url: "{{ site.url }}/stm/eventim-ids"
          text: "{{ item.text }}"
          value: "{{ item.value }}"
      theasoftid:
        label: Theasoft ID
        type: text
        placeholder: Hier müsste dann die Theasoft ID stehen
      besetzung:
        label: Besetzung
        type: structure
        fields:
          rolle:
            label: Rolle
            type: text
          darsteller:
            label: Darsteller
            type: text
      beschreibung:
        width: 1/2
        label: Beschreibung des Stücks
        type: textarea
        size: large
      credits:
        width: 1/2      
        label: Credits
        type: textarea


