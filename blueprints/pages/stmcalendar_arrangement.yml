title: Arrangement

# Fields shown in the page creation dialog
create:
  fields: 
    - eventimid
    - theasoftid

sections:
  pages:
    type: pages
  fields:
    type: fields
    fields:
      eventimid:
        label: Eventim ID
        type: tags
        max: 2
        help: "wäre es sinnvoll hier mehrere tags möglich zu machen »Quatsch, existiert z.B. zwei mal … "
        options:
          type: api
          url: "{{ site.url }}/stm/eventim-ids"
          text: "{{ item.text }}"
          value: "{{ item.value }}"
      theasoftid:
        label: Theasoft ID
        type: text
       
       
      myblocks:
        type: blocks
        fieldsets:
          - stmcalendar